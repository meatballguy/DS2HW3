name: Update README on Push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate recent commits table
        id: commits
        run: |
          # Build a Markdown table of the last 10 commits
          TABLE="| SHA | Message | Date |\n|---|---|---|\n"
          while IFS='|' read -r sha msg date; do
            short="${sha:0:7}"
            TABLE+="| [\`${short}\`](../../commit/${sha}) | ${msg} | ${date} |\n"
          done < <(git log -10 --pretty=format:"%H|%s|%ad" --date=short)

          # Escape special characters for the sed replacement
          ESCAPED=$(printf '%s' "$TABLE" | sed 's/\\/\\\\/g; s/\//\\\//g; s/&/\\\&/g')

          # Replace content between the sentinel comments
          sed -i "/<!-- COMMITS_START -->/,/<!-- COMMITS_END -->/{
            /<!-- COMMITS_START -->/{ p; d }
            /<!-- COMMITS_END -->/{ i\\${ESCAPED}
              d }
            d
          }" README.md

      - name: Commit updated README
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update recent commits in README [skip ci]"
          git push
